name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realtime_game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d realtime_game_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realtime_game_test?schema=public
      REDIS_URL: redis://localhost:6379/15
      JWT_ACCESS_SECRET: ci-access-secret-not-a-placeholder-value-min-32
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-placeholder-value-min-32
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      GAME_TICK_RATE: 20
      MAX_PLAYERS_PER_ROOM: 8
      MAX_MOVE_SPEED: 12
      HEARTBEAT_INTERVAL_MS: 5000
      HEARTBEAT_TIMEOUT_MS: 15000
      WS_RATE_LIMIT_PER_SECOND: 30
      BCRYPT_ROUNDS: 10
      HTTP_RATE_LIMIT_MAX: 300
      AUTH_RATE_LIMIT_MAX: 20
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: realtime-game-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
